# Public subscription gateway behind Caddy on a private Docker network.
name: unified-proxy-cli

services:
  cli-proxy-api:
    # CLIProxyAPI v8.0.52 (runs as linux/arm64). Pinned to the published multi-arch index digest.
    image: eceasy/cli-proxy-api@sha256:5d5bab318ac048c0f88570c6ffb852ef3e42e9acc9bfcf346c524de7a2468131
    command: ["./CLIProxyAPI", "--config", "/CLIProxyAPI/config.yaml"]
    user: "${CLI_PROXY_UID:-1001}:${CLI_PROXY_GID:-1001}"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
    volumes:
      - ./.cli-proxy-api/config.yaml:/CLIProxyAPI/config.yaml:ro
      - ./.cli-proxy-api/auths:/state
      - ./.cli-proxy-api/plugins:/plugins:ro
    ports:
      - "127.0.0.1:8317:8317"
      # OAuth callback ports remain private to the server and SSH tunnels.
      - "127.0.0.1:1455:1455"
      - "127.0.0.1:54545:54545"
      - "127.0.0.1:51121:51121"
