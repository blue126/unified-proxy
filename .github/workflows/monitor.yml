name: Monitor deployed proxy

# Token auth, quota, model availability, and upstream reachability can all fail
# while the proxy process itself remains healthy. The smoke test reports the
# exact provider-level reason, warns when one provider is down, and fails the
# workflow only when both providers are unavailable.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  monitor:
    name: Health + live inference
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Provider health + live inference
        env:
          BASE_URL: https://${{ secrets.PROXY_DOMAIN }}
          PROXY_API_KEY: ${{ secrets.PROXY_API_KEY }}
        run: ./scripts/smoke.sh
