name: Monitor deployed proxy

# CLIProxyAPI verifies GPT, Claude, Gemini, and CodeBuddy live calls.
# Providers are checked independently: some failing -> warning + Bark push;
# all failing -> error + time-sensitive Bark push.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    name: Health + live inference
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: WorkBuddy refresh timer health
        id: timer
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -e
            python3 /opt/unified-proxy/scripts/cli-proxy-refresh-workbuddy.py --check --check-timer

      - name: Provider health + live inference
        env:
          BASE_URL: https://${{ secrets.PROXY_DOMAIN }}
          PROXY_API_KEY: ${{ secrets.PROXY_API_KEY }}
        run: ./scripts/smoke.sh --results "$RUNNER_TEMP/provider-results.json"

      - name: Alert on provider failures
        if: always()
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TIMER_OUTCOME: ${{ steps.timer.outcome }}
        run: |
          if [ -f "$RUNNER_TEMP/provider-results.json" ]; then
            python3 scripts/monitor-notify.py "$RUNNER_TEMP/provider-results.json"
          fi
