name: PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Validate subscription gateway
        run: |
          docker compose -f compose.cli-proxy.yaml config --quiet
          python3 -m compileall -q scripts/cli-proxy-*.py
      - name: Validate runtime smoke dispatch
        run: bash -n scripts/smoke.sh scripts/cli-proxy-install-refresh.sh
