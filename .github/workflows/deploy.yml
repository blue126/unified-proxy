name: Deploy to OCI VM

on:
  push:
    branches: [main]
    # Docs-only merges cannot change what the VM runs, so skip the restart.
    paths-ignore:
      - '**/*.md'

# Credential maintenance and deployments share the same host.
concurrency:
  group: unified-proxy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -e

            TMPDIR=$(mktemp -d)
            INSTALL_DIR=/opt/unified-proxy
            trap 'rm -rf "$TMPDIR"' EXIT

            # Clone latest code
            git clone --depth 1 https://github.com/${{ github.repository }}.git "$TMPDIR"

            test -f "$INSTALL_DIR/.cli-proxy-active" \
              || { echo 'CLIProxyAPI activation marker is missing.' >&2; exit 1; }
            cp "$TMPDIR/compose.cli-proxy.yaml" "$INSTALL_DIR/compose.cli-proxy.yaml"
            mkdir -p "$INSTALL_DIR/scripts"
            cp "$TMPDIR"/scripts/cli-proxy-*.py "$INSTALL_DIR/scripts/"
            cd "$INSTALL_DIR"
            python3 scripts/cli-proxy-install-plugin.py
            docker compose -f compose.cli-proxy.yaml up -d
            python3 scripts/cli-proxy-smoke.py --expect-model glm-5.2

      - name: Smoke test
        env:
          BASE_URL: https://${{ secrets.PROXY_DOMAIN }}
          PROXY_API_KEY: ${{ secrets.PROXY_API_KEY }}
        run: ./scripts/smoke.sh
