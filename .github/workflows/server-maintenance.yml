name: Server maintenance

# Claude or Codex re-authentication without a Mac, port forward or browser on the server:
#   1. Run <provider>-login-start, open the URL printed in the log, approve.
#   2. Copy the final (failed) localhost address, or the code#state text.
#   3. Run <provider>-login-complete with that value as callback.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run on the OCI server
        type: choice
        required: true
        default: diagnose
        options:
          - diagnose
          - claude-login-start
          - claude-login-complete
          - codex-login-start
          - codex-login-complete
      callback:
        description: For complete only, the localhost callback URL or code#state from the browser
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: unified-proxy-production
  cancel-in-progress: false

jobs:
  maintenance:
    # Only reviewed code on the default branch may use production credentials.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Mask before putting the value in a step's env: the runner logs env values
      # before that step's shell starts, so add-mask inside it would be too late.
      - name: Mask callback
        run: |
          python3 - <<'PY'
          import importlib.util
          import json
          import os
          from urllib.parse import quote
          with open(os.environ['GITHUB_EVENT_PATH']) as source:
              inputs = json.load(source).get('inputs', {})
          if inputs.get('operation', '').endswith('-login-complete'):
              spec = importlib.util.spec_from_file_location('auth', 'scripts/cli-proxy-oauth-login.py')
              auth = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(auth)
              try:
                  code, state = auth.parse_callback(inputs.get('callback', ''))
              except ValueError as error:
                  raise SystemExit(str(error))
              for secret in (inputs['callback'].strip(), code, state, quote(code), quote(state)):
                  print('::add-mask::' + secret)
          PY

      - name: Run maintenance via SSH
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_SSH_FINGERPRINT: ${{ secrets.OCI_SSH_FINGERPRINT }}
          OPERATION: ${{ inputs.operation }}
          OAUTH_CALLBACK: ${{ inputs.callback }}
        shell: bash
        run: |
          set -euo pipefail
          case "$OPERATION" in
            diagnose) command=status provider=claude ;;
            claude-login-start) command=start provider=claude ;;
            claude-login-complete) command=complete provider=claude ;;
            codex-login-start) command=start provider=codex ;;
            codex-login-complete) command=complete provider=codex ;;
            *) echo 'Unknown operation.' >&2; exit 1 ;;
          esac
          : "${OCI_HOST:?Missing OCI_HOST}" "${OCI_USER:?Missing OCI_USER}" "${OCI_SSH_KEY:?Missing OCI_SSH_KEY}"
          if [[ ! "$OCI_HOST" =~ ^[A-Za-z0-9._:-]+$ || ! "$OCI_USER" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo 'Invalid SSH host or username.' >&2
            exit 1
          fi
          umask 077
          key_file="$RUNNER_TEMP/oci-maintenance-key"
          hosts_file="$RUNNER_TEMP/oci-maintenance-hosts"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$OCI_SSH_KEY" > "$key_file"
          ssh-keyscan -T 10 -t ed25519,rsa "$OCI_HOST" > "$hosts_file"
          if [[ -n "$OCI_SSH_FINGERPRINT" ]]; then
            ssh-keygen -lf "$hosts_file" | awk '{print $2}' | grep -Fxq "$OCI_SSH_FINGERPRINT"
            # Keep only the key whose fingerprint matched the configured pin.
            pinned_hosts="$RUNNER_TEMP/oci-maintenance-pinned"
            while IFS= read -r host_key; do
              fingerprint=$(printf '%s\n' "$host_key" | ssh-keygen -lf - | awk '{print $2}')
              if [[ "$fingerprint" == "$OCI_SSH_FINGERPRINT" ]]; then
                printf '%s\n' "$host_key" >> "$pinned_hosts"
              fi
            done < "$hosts_file"
            mv "$pinned_hosts" "$hosts_file"
          fi
          ssh_options=(-i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts_file")
          target="$OCI_USER@$OCI_HOST"
          ssh "${ssh_options[@]}" "$target" 'umask 077; mkdir -p /opt/unified-proxy/.maintenance; chmod 700 /opt/unified-proxy/.maintenance'
          scp "${ssh_options[@]}" scripts/cli-proxy-oauth-login.py "$target:/opt/unified-proxy/.maintenance/cli-proxy-oauth-login.py"
          # %q prevents the callback from becoming shell syntax on the server.
          printf -v remote 'OAUTH_CALLBACK=%q python3 /opt/unified-proxy/.maintenance/cli-proxy-oauth-login.py %s --provider %s' "$OAUTH_CALLBACK" "$command" "$provider"
          ssh "${ssh_options[@]}" "$target" "$remote"

      - name: Verify provider with live inference
        if: endsWith(inputs.operation, '-login-complete')
        env:
          BASE_URL: https://${{ secrets.PROXY_DOMAIN }}
          PROXY_API_KEY: ${{ secrets.PROXY_API_KEY }}
          SMOKE_PROVIDER: ${{ startsWith(inputs.operation, 'codex-') && 'gpt' || 'claude' }}
        run: |
          ./scripts/smoke.sh --results "$RUNNER_TEMP/results.json" || true
          python3 - <<'PY'
          import json
          import os
          with open(os.environ['RUNNER_TEMP'] + '/results.json') as handle:
              provider = os.environ['SMOKE_PROVIDER']
              result = json.load(handle)['providers'][provider]
          if not result['ok']:
              raise SystemExit(provider + ' verification failed: ' + result['reason'])
          print(provider + ' authentication and live inference verified.')
          PY
