name: Server maintenance

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run on the OCI server
        type: choice
        required: true
        default: diagnose
        options:
          - diagnose
          - claude-login-start
          - claude-login-complete
      authorization_code:
        description: For complete only, paste the full one-time code#state from the browser
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: unified-proxy-production
  cancel-in-progress: false

jobs:
  maintenance:
    # Only reviewed code on the default branch may use production credentials.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Mask before putting the code in a step's env: the runner logs env values
      # before that step's shell starts, so add-mask inside it would be too late.
      - name: Mask authorization code
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          with open(os.environ['GITHUB_EVENT_PATH']) as source:
              inputs = json.load(source).get('inputs', {})
          if inputs.get('operation') == 'claude-login-complete':
              code = inputs.get('authorization_code', '')
              if not re.fullmatch(r'[A-Za-z0-9_-]+#[A-Za-z0-9_-]+', code):
                  raise SystemExit('A full code#state authorization code is required.')
              print('::add-mask::' + code)
              print('::add-mask::' + code.split('#', 1)[0])
          PY

      - name: Run maintenance via SSH
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          OCI_SSH_FINGERPRINT: ${{ secrets.OCI_SSH_FINGERPRINT }}
          OPERATION: ${{ inputs.operation }}
          CLAUDE_AUTH_CODE: ${{ inputs.authorization_code }}
        shell: bash
        run: |
          set -euo pipefail
          case "$OPERATION" in
            diagnose|claude-login-start) ;;
            claude-login-complete)
              if [[ ! "$CLAUDE_AUTH_CODE" =~ ^[A-Za-z0-9_-]+#[A-Za-z0-9_-]+$ ]]; then
                echo 'A full code#state authorization code is required.' >&2
                exit 1
              fi
              ;;
            *) echo 'Unknown operation.' >&2; exit 1 ;;
          esac
          : "${OCI_HOST:?Missing OCI_HOST}" "${OCI_USER:?Missing OCI_USER}" "${OCI_SSH_KEY:?Missing OCI_SSH_KEY}"
          if [[ ! "$OCI_HOST" =~ ^[A-Za-z0-9._:-]+$ || ! "$OCI_USER" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo 'Invalid SSH host or username.' >&2
            exit 1
          fi
          umask 077
          key_file="$RUNNER_TEMP/oci-maintenance-key"
          hosts_file="$RUNNER_TEMP/oci-maintenance-hosts"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$OCI_SSH_KEY" > "$key_file"
          ssh-keyscan -T 10 -t ed25519,rsa "$OCI_HOST" > "$hosts_file"
          if [[ -n "$OCI_SSH_FINGERPRINT" ]]; then
            ssh-keygen -lf "$hosts_file" | awk '{print $2}' | grep -Fxq "$OCI_SSH_FINGERPRINT"
            # Keep only the key whose fingerprint matched the configured pin.
            pinned_hosts="$RUNNER_TEMP/oci-maintenance-pinned"
            while IFS= read -r host_key; do
              fingerprint=$(printf '%s\n' "$host_key" | ssh-keygen -lf - | awk '{print $2}')
              if [[ "$fingerprint" == "$OCI_SSH_FINGERPRINT" ]]; then
                printf '%s\n' "$host_key" >> "$pinned_hosts"
              fi
            done < "$hosts_file"
            mv "$pinned_hosts" "$hosts_file"
          fi
          ssh_options=(-i "$key_file" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts_file")
          target="$OCI_USER@$OCI_HOST"
          if [[ "$OPERATION" != diagnose ]]; then
            ssh "${ssh_options[@]}" "$target" 'umask 077; mkdir -p /opt/unified-proxy/.maintenance; chmod 700 /opt/unified-proxy/.maintenance'
            scp "${ssh_options[@]}" scripts/claude-headless-auth.js "$target:/opt/unified-proxy/.maintenance/claude-headless-auth.mjs"
          fi
          {
            # %q prevents an authorization code from becoming shell syntax.
            printf 'export CLAUDE_AUTH_CODE=%q\n' "$CLAUDE_AUTH_CODE"
            cat scripts/server-maintenance.sh
          } | ssh "${ssh_options[@]}" "$target" bash -s -- "$OPERATION"

      - name: Verify Claude with live inference
        if: inputs.operation == 'claude-login-complete'
        env:
          BASE_URL: https://${{ secrets.PROXY_DOMAIN }}
          PROXY_API_KEY: ${{ secrets.PROXY_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          sys.path.insert(0, 'scripts')
          from smoke import SmokeClient, fetch_models, run_provider
          client = SmokeClient(os.environ['BASE_URL'], os.environ['PROXY_API_KEY'])
          models, catalog_issue = fetch_models(client)
          result = run_provider(
              client, 'anthropic', 'Anthropic', models.get('anthropic', ''),
              [{'role': 'user', 'content': 'Reply with exactly the word: pong'}],
              max_tokens=10, health='', catalog_issue=catalog_issue,
          )
          if not result.available:
              raise SystemExit('Claude verification failed: ' + result.detail)
          print('Claude authentication and live inference verified.')
          PY
